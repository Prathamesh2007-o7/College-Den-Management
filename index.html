<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Den Management - Check In</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="background" aria-hidden="true"></div>

  <a href="/admin" class="admin-btn">Admin</a>

  <main class="card kiosk">
    <header>
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 28 28" fill="none" aria-hidden="true">
          <path d="M4 4L14 14L4 24M24 4L14 14L24 24M14 4V24" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">VIT</span>
      </div>
      <h1 class="title">Den Management <span class="controller-icon" aria-hidden="true">🎮</span></h1>
      <p class="subtitle">Authenticate with your roll number to begin:</p>
    </header>

    <!-- Step 1: roll-number verification -->
    <form id="entry-form" class="kiosk__form" autocomplete="off">
      <label class="sr-only" for="roll_number">Roll number</label>
      <div class="input-wrapper">
        <span class="input-icon" aria-hidden="true">🪪</span>
        <input id="roll_number" name="roll_number" class="roll-input kiosk__input" type="text" placeholder="eg. CS2024001" autofocus>
      </div>
      <button type="submit" class="checkin-btn kiosk__button">Check in <span aria-hidden="true">→</span></button>
    </form>

    <!-- Step 2: existing active session -->
    <section id="checkout-step" class="kiosk__form" hidden>
      <div class="session-info-card">
        <div class="session-info-card__header"><span class="session-dot"></span><span id="active-student-name">Student</span></div>
        <div class="info-row"><span>Activity</span><strong id="active-activity-name">-</strong></div>
        <div class="info-row"><span>Time left</span><strong id="active-time-left" class="highlight-text">-</strong></div>
      </div>
      <button type="button" id="checkout-btn" class="checkin-btn kiosk__button kiosk__button--danger">End Session &amp; Check Out</button>
      <button type="button" class="back-btn">← Back</button>
    </section>

    <!-- Step 3: activity selection -->
    <section id="action-selection-step" class="kiosk__form" hidden>
      <h2 class="selection-title">Select an activity</h2>
      <div class="options-grid options-grid--2col">
        <button type="button" class="option-btn" data-action="activity" data-value="Table Tennis"><span>🏓</span><span><b>Table Tennis</b><small>Limit: 2</small></span></button>
        <button type="button" class="option-btn" data-action="activity" data-value="Carrom"><span>🎯</span><span><b>Carrom</b><small>Limit: 12</small></span></button>
        <button type="button" class="option-btn" data-action="activity" data-value="Chess"><span>♟️</span><span><b>Chess</b><small>Limit: 4</small></span></button>
        <button type="button" class="option-btn" data-action="activity" data-value="PC Gaming"><span>🖥️</span><span><b>PC Gaming</b><small>Limit: 6</small></span></button>
        <button type="button" class="option-btn" data-action="activity" data-value="PS5 Gaming"><span>🎮</span><span><b>PS5 Gaming</b><small>Limit: 4</small></span></button>
        <button type="button" class="option-btn" data-action="activity" data-value="Air Hockey"><span>🏒</span><span><b>Air Hockey</b><small>Limit: 2</small></span></button>
      </div>
      <button type="button" class="option-btn option-btn--highlight" data-action="rent-mode"><span>📦</span><span><b>Rent Equipment</b><small>Balls, Rackets &amp; Gear</small></span></button>
      <button type="button" class="back-btn">← Cancel</button>
    </section>

    <!-- Step 4: equipment selection -->
    <section id="equipment-selection-step" class="kiosk__form" hidden>
      <h2 class="selection-title">Select equipment</h2>
      <div class="options-grid">
        <button type="button" class="equip-btn" data-item="Basketball">🏀 <b>Basketball</b></button>
        <button type="button" class="equip-btn" data-item="Badminton Rackets">🏸 <b>Badminton Rackets</b></button>
        <button type="button" class="equip-btn" data-item="Football">⚽ <b>Football</b></button>
        <button type="button" class="equip-btn" data-item="Cricket gear">🏏 <b>Cricket gear</b></button>
      </div>
      <button type="button" class="back-btn">← Back</button>
    </section>

    <!-- Step 5: rental duration -->
    <section id="duration-selection-step" class="kiosk__form" hidden>
      <h2 class="selection-title">Select rental duration</h2>
      <div class="options-grid options-grid--duration">
        <button type="button" class="duration-btn" data-hours="1"><b>1</b><span>Hour</span></button>
        <button type="button" class="duration-btn" data-hours="2"><b>2</b><span>Hours</span></button>
        <button type="button" class="duration-btn" data-hours="3"><b>3</b><span>Hours</span></button>
      </div>
      <button type="button" class="back-btn">← Back</button>
    </section>

    <section id="result" class="result" data-state="idle" aria-live="polite">
      <span class="result__indicator"></span><span class="result__status">Awaiting input</span><span class="result__reason"></span>
    </section>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
